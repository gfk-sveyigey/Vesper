name: Build & Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Xcode 27 and Swift 6.3 toolchain
        run: |
          set -e
          xcodebuild -version
          xcrun swift --version

          xcodebuild -version | grep -Eq '^Xcode 27([.]|$)' || {
            echo "::error::Expected Xcode 27"
            exit 1
          }

          SWIFT_VERSION="$(xcrun swift --version | sed -nE 's/^Apple Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)"
          if [ -z "$SWIFT_VERSION" ] || ! awk -F. -v version="$SWIFT_VERSION" 'BEGIN {
            split(version, v, ".")
            exit !((v[1] + 0) > 6 || ((v[1] + 0) == 6 && (v[2] + 0) >= 3))
          }'; then
            echo "::error::Swift 6.3 or newer is required; found ${SWIFT_VERSION:-unknown}"
            exit 1
          fi

      - name: Validate project inputs
        run: |
          set -e
          test -d Vesper.xcodeproj || {
            echo "::error::Vesper.xcodeproj not found"
            exit 1
          }
          test -f Info.plist || {
            echo "::error::Info.plist not found"
            exit 1
          }
          plutil -lint Info.plist

      - name: Resolve Swift packages
        run: |
          set -e
          rm -rf build/DerivedData
          xcodebuild \
            -resolvePackageDependencies \
            -project Vesper.xcodeproj \
            -scheme Vesper \
            -derivedDataPath build/DerivedData

          test -f Vesper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || {
            echo "::error::Xcode did not produce Package.resolved"
            exit 1
          }

      - name: Read version
        id: version
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found in repository root"
            exit 1
          fi

          RAW=$(tr -d '[:space:]' < VERSION)
          if [ -z "$RAW" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi

          if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION '$RAW' is not a valid semver"
            exit 1
          fi

          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Version: $RAW"

      - name: Check existing tag
        id: check
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; will release."
          fi

      - name: Save PR body
        if: steps.check.outputs.exists == 'false'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          mkdir -p build
          if [ -z "$PR_BODY" ]; then
            printf '_No description provided._\n' > build/PR_BODY.md
          else
            printf '%s\n' "$PR_BODY" > build/PR_BODY.md
          fi

      - name: Build unsigned iOS app
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          xcodebuild \
            -project Vesper.xcodeproj \
            -scheme Vesper \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            MARKETING_VERSION='${{ steps.version.outputs.raw }}' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Audit playback framework isolation
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/Vesper.app"
          test -d "$APP" || {
            echo "::error::Vesper.app was not produced"
            exit 1
          }
          test "$(plutil -extract VesperAppGroupIdentifier raw "$APP/Info.plist")" = \
               "$(plutil -extract VesperAppGroupIdentifier raw "$APP/PlugIns/VesperShare.appex/Info.plist")"
          python3 BuildSupport/audit_playback_isolation.py "$APP"

      - name: Package unsigned IPA
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/Vesper.app"
          IPA="build/Vesper-${{ steps.version.outputs.raw }}-unsigned.ipa"

          test -d "$APP" || {
            echo "::error::Vesper.app was not produced"
            exit 1
          }

          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          test "$BUNDLE_ID" = com.aholic.vesper || {
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          }

          MINIMUM_OS=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          test "$MINIMUM_OS" = 26.0 || {
            echo "::error::MinimumOSVersion must be 26.0, got: $MINIMUM_OS"
            exit 1
          }

          rm -rf build/Payload "$IPA"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Vesper.app

          cd build
          /usr/bin/zip -qry "$(basename "$IPA")" Payload
          cd ..
          rm -rf build/Payload

          test -f "$IPA"
          ls -lh "$IPA"

      - name: Calculate SHA256
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          IPA="build/Vesper-${{ steps.version.outputs.raw }}-unsigned.ipa"
          SHA256=$(shasum -a 256 "$IPA" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$(basename "$IPA")" > build/SHA256.txt

          {
            echo ""
            echo "---"
            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            cat build/SHA256.txt
            echo '```'
          } >> build/PR_BODY.md

      - name: Upload IPA artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-${{ steps.version.outputs.raw }}-release
          path: build/Vesper-${{ steps.version.outputs.raw }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Vesper ${{ steps.version.outputs.tag }}"
          body_path: build/PR_BODY.md
          files: |
            build/Vesper-${{ steps.version.outputs.raw }}-unsigned.ipa
            build/SHA256.txt
          draft: false
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.raw, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
