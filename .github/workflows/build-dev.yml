name: Build (dev)

# 只改 VERSION 或 .github 配置不会触发构建。
# App、播放引擎、隔离脚本或 Xcode 工程变化会触发构建。
on:
  push:
    branches: [ dev ]
    paths:
      - 'Vesper/**'
      - 'Playback/**'
      - 'BuildSupport/**'
      - 'Vesper.xcodeproj/**'
      - 'Info.plist'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27 and Swift 6.3 toolchain
        run: |
          set -e
          xcodebuild -version
          xcrun swift --version

          xcodebuild -version | grep -Eq '^Xcode 27([.]|$)' || {
            echo "::error::Expected Xcode 27"
            exit 1
          }

          SWIFT_VERSION="$(xcrun swift --version | sed -nE 's/^Apple Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)"
          if [ -z "$SWIFT_VERSION" ] || ! awk -F. -v version="$SWIFT_VERSION" 'BEGIN {
            split(version, v, ".")
            exit !((v[1] + 0) > 6 || ((v[1] + 0) == 6 && (v[2] + 0) >= 3))
          }'; then
            echo "::error::Swift 6.3 or newer is required; found ${SWIFT_VERSION:-unknown}"
            exit 1
          fi

      - name: Validate project inputs
        run: |
          set -e
          test -d Vesper.xcodeproj || {
            echo "::error::Vesper.xcodeproj not found"
            exit 1
          }
          test -f Info.plist || {
            echo "::error::Info.plist not found"
            exit 1
          }
          test -f Vesper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || {
            echo "::error::Commit the resolved Swift package graph before building"
            exit 1
          }
          plutil -lint Info.plist

      - name: Read version
        id: version
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found in repository root"
            exit 1
          fi

          RAW=$(tr -d '[:space:]' < VERSION)
          if [ -z "$RAW" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi

          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "Version: $RAW"

      - name: Build unsigned iOS app (Debug)
        run: |
          set -e
          rm -rf build/DerivedData

          xcodebuild \
            -project Vesper.xcodeproj \
            -scheme Vesper \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            MARKETING_VERSION='${{ steps.version.outputs.raw }}(Build dev ${{ github.run_number }})' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Audit playback framework isolation
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Vesper.app"
          test -d "$APP" || {
            echo "::error::Vesper.app was not produced"
            exit 1
          }
          python3 BuildSupport/audit_playback_isolation.py "$APP"

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Vesper.app"
          IPA="build/Vesper-${{ steps.version.outputs.raw }}-dev${{ github.run_number }}-unsigned.ipa"

          test -d "$APP" || {
            echo "::error::Vesper.app was not produced"
            exit 1
          }

          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          test "$BUNDLE_ID" = com.aholic.vesper || {
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          }

          MINIMUM_OS=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          test "$MINIMUM_OS" = 26.0 || {
            echo "::error::MinimumOSVersion must be 26.0, got: $MINIMUM_OS"
            exit 1
          }

          rm -rf build/Payload "$IPA"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Vesper.app

          cd build
          /usr/bin/zip -qry "$(basename "$IPA")" Payload
          cd ..
          rm -rf build/Payload

          test -f "$IPA"
          ls -lh "$IPA"
          shasum -a 256 "$IPA"

      - name: Smoke check product
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Vesper.app"
          ls -la "$APP"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleDisplayName|CFBundleIdentifier"

      - name: Upload IPA and isolation report
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-${{ steps.version.outputs.raw }}-dev${{ github.run_number }}
          path: |
            build/Vesper-*-unsigned.ipa
            build/DerivedData/Build/Products/Debug-iphoneos/playback-isolation-report.txt
          if-no-files-found: error
          retention-days: 14